name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The inherited lint and JVM test jobs are intentionally not run here yet:
      # lint contains extensive upstream debt, and some plugin tests depend on
      # native QuickJS components that are not available in the GitHub runner.
      # Device regression remains the release gate for those areas.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEYS: ${{ secrets.TMDB_API_KEYS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParafusoTV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
